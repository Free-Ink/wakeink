; WakeInk — calendar alarm firmware for FreeInk e-ink devices.
; One binary per device: `pio run -e murphy` (Murphy M3) or
; `pio run -e m5papercolor` (M5Stack PaperColor).
;
; Built on the FreeInk SDK (vendored at vendor/freeink-sdk).
; The [base] section mirrors freeink-sdk/platformio.sample.ini.

[platformio]
default_envs = murphy

[base]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.37/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
upload_speed = 921600

build_flags =
  -std=gnu++2a
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DEINK_DISPLAY_SINGLE_BUFFER_MODE=1
  -DWAKEINK_VERSION=\"0.1.0\"

build_unflags =
  -std=gnu++11

board_build.flash_mode = dio
board_build.flash_size = 16MB
board_build.partitions = partitions.csv
board_build.filesystem = littlefs

extra_scripts =
  pre:scripts/build_html.py
  pre:scripts/embed_assets.py
  post:scripts/archive_elf.py

; FreeInk SDK is vendored as a pinned git submodule at vendor/freeink-sdk —
; run `git submodule update --init` after cloning so these paths resolve.
lib_deps =
  BoardConfig=symlink://vendor/freeink-sdk/libs/hardware/BoardConfig
  EInkDisplay=symlink://vendor/freeink-sdk/libs/display/FreeInkDisplay
  InputManager=symlink://vendor/freeink-sdk/libs/hardware/InputManager
  BatteryMonitor=symlink://vendor/freeink-sdk/libs/hardware/BatteryMonitor
  FrontlightManager=symlink://vendor/freeink-sdk/libs/hardware/FrontlightManager
  AudioManager=symlink://vendor/freeink-sdk/libs/hardware/AudioManager
  LedManager=symlink://vendor/freeink-sdk/libs/hardware/LedManager
  FreeInkUI=symlink://vendor/freeink-sdk/libs/ui/FreeInkUI
  bblanchon/ArduinoJson @ 7.4.2
  ricmoo/QRCode @ 0.0.1

; --- Murphy M3 — ESP32-S3, UC8253 + CHSC6x touch + frontlight -----------------
; PSRAM is deliberately OFF: with it enabled (dio_opi + -DBOARD_HAS_PSRAM) the
; device produced random heap-corruption crashes under load (victims in parser
; Strings, newlib locks, and WiFi driver queues), all of which trace to
; marginal external RAM, not code — see README "PSRAM" note. Internal-only is
; viable: transfers are gzip'd, parsing is windowed/bounded, and the sync task
; degrades gracefully below the low-heap floor.
; NOTE: the obvious board (esp32-s3-devkitc1-n16r8) force-enables octal PSRAM
; through its own defaults (memory_type=qio_opi + -DBOARD_HAS_PSRAM), so
; "removing" PSRAM flags from this file silently kept it on. The plain
; devkitc-1 profile has no PSRAM defaults; with dio_qspi libs the (octal)
; PSRAM chip can't init even in principle, and the framework libs match the
; DIO flash mode we actually boot with.
[env:murphy]
extends = base
board = esp32-s3-devkitc-1
board_build.mcu = esp32s3
board_build.arduino.memory_type = dio_qspi
board_upload.flash_size = 16MB
build_unflags =
  ${base.build_unflags}
  -DBOARD_HAS_PSRAM
build_flags =
  ${base.build_flags}
  -DFREEINK_DEVICE_MURPHY=1

; --- M5Stack PaperColor — ESP32-S3, ED2208 Spectra-6 color panel --------------
; Native FreeInk driver: the 6-color full waveform takes ~15 s, so refreshes are
; interrupted at ~340 ms for a fast high-contrast monochrome image (see the SDK
; README "M5Stack PaperColor refresh behavior"). Alarm sound plays through the
; built-in 1W speaker (ES8311 codec + AW8737A amp, FREEINK_CAP_AUDIO auto-on).
; The board has no touch and no frontlight — those managers compile to no-op
; stubs, any button press dismisses an alarm, and all configuration happens on
; the web dashboard. Board/flash/PSRAM settings mirror the SDK sample's m5paper
; env (the Murphy PSRAM trouble was that unit's marginal chip, not an S3-wide
; issue, so PSRAM stays on here).
[env:m5papercolor]
extends = base
board = esp32-s3-devkitc1-n16r8
board_build.mcu = esp32s3
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_opi
build_flags =
  ${base.build_flags}
  -DFREEINK_DEVICE_M5=1
  ; Straight (light) polarity: the standing image is always the COMPLETE
  ; waveform's truthful render (true white), refreshed every 15 minutes by
  ; main.cpp. Interrupted refreshes are reserved for interaction frames, so
  ; their instability (white track cut mid-flight) is transient and cleaned by
  ; the next scheduled pass. The dark hack (-DFREEINK_M5_DARK_FAST_REFRESH=1)
  ; only matters when interrupted output must STAND for minutes — not here.
